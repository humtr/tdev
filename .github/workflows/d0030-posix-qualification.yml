name: D0030 POSIX qualification

on:
  push:
    branches:
      - group/f-cloudflare-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Use minimum supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build package-owned D0030 helper
        run: npm run build:native:d0030 --silent

      - name: Record POSIX environment and helper identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .d0030-evidence
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'node=%s\n' "$(node --version)"
            printf 'platform=%s\n' "$(node -p 'process.platform')"
            printf 'arch=%s\n' "$(node -p 'process.arch')"
            printf 'kernel=%s\n' "$(uname -a)"
            printf 'filesystem=%s\n' "$(stat -f -c '%T' .)"
            printf 'compiler=%s\n' "$(cc --version | head -n 1)"
            printf 'source_sha256=%s\n' "$(sha256sum native/d0030/rename_noreplace_helper.c | awk '{print $1}')"
            printf 'helper_sha256=%s\n' "$(sha256sum native/d0030/linux-x64/rename-noreplace-helper | awk '{print $1}')"
          } | tee .d0030-evidence/environment.txt
          cat native/d0030/manifest.json | tee .d0030-evidence/manifest.json

      - name: Run D0030 focused falsifiers
        run: node --test test/d0030-publication-portability.test.mjs

      - name: Run unchanged immutable-journal oracle through rename-noreplace
        env:
          TDEV_TEST_IMMUTABLE_JOURNAL_PUBLICATION_BACKEND: rename-noreplace
        run: node --test test/immutable-journal.test.mjs

      - name: Run unchanged immutable-journal oracle through hardlink
        env:
          TDEV_TEST_IMMUTABLE_JOURNAL_PUBLICATION_BACKEND: hardlink
        run: node --test test/immutable-journal.test.mjs

      - name: Run mixed hardlink versus rename independent-process races
        run: node tools/d0030-posix-mixed-race.mjs 25 | tee .d0030-evidence/mixed-race.json

      - name: Fresh installed-copy qualification and helper replacement recovery
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/d0030-install"
          mkdir -p "$root/app" "$root/cases/one" "$root/cases/missing" "$root/cases/tampered" "$root/cases/restored"
          printf '{"name":"d0030-posix-install","private":true,"type":"module"}\n' > "$root/app/package.json"
          cd "$root/app"
          npm install --ignore-scripts --install-links --no-audit --no-fund "$GITHUB_WORKSPACE" >/dev/null
          pkg="$root/app/node_modules/@humtr/tdev"
          helper="$pkg/native/d0030/linux-x64/rename-noreplace-helper"
          test -d "$pkg" && test ! -L "$pkg" && test -x "$helper"
          cat > smoke.mjs <<'NODE'
          import { CaseEngine, ImmutableJournalSnapshotStore, definePlan } from '@humtr/tdev';
          const [directory, caseId, backend, expected] = process.argv.slice(2);
          const plan = definePlan({
            revisionId: 'plan-v1', baseTree: {}, tasks: [
              { id: 'a', kind: 'work', dependencies: [], claims: [], input: {} },
              { id: 'promote', kind: 'promotion', dependencies: ['a'], claims: [{ mode: 'write', resource: 'canonical:tree' }], input: {} },
            ],
          });
          const snapshot = new CaseEngine({ caseId, plan }).snapshot();
          try {
            const store = new ImmutableJournalSnapshotStore(directory, { publicationBackend: backend });
            await store.create(snapshot);
            const loaded = await new ImmutableJournalSnapshotStore(directory, { publicationBackend: backend }).load(caseId);
            if (loaded.caseRevision !== snapshot.caseRevision) throw new Error('revision mismatch');
            if (expected !== 'success') throw new Error(`expected ${expected} but write succeeded`);
            console.log(JSON.stringify({ ok: true, backend, revision: loaded.caseRevision }));
          } catch (error) {
            console.log(JSON.stringify({ ok: false, backend, code: error?.code ?? null }));
            if (expected !== error?.code) throw error;
          }
          NODE
          node smoke.mjs "$root/cases/one" posix-one rename-noreplace success
          cp "$helper" "$root/helper.backup"
          rm "$helper"
          node smoke.mjs "$root/cases/missing" posix-missing rename-noreplace store_publication_unsupported
          test ! -e "$root/cases/missing/posix-missing/base.json"
          cp "$root/helper.backup" "$helper"
          chmod 755 "$helper"
          printf 'tamper' >> "$helper"
          node smoke.mjs "$root/cases/tampered" posix-tampered rename-noreplace store_publication_unsupported
          test ! -e "$root/cases/tampered/posix-tampered/base.json"
          cp "$root/helper.backup" "$helper"
          chmod 755 "$helper"
          node smoke.mjs "$root/cases/restored" posix-restored rename-noreplace success
          sha256sum "$helper" | tee "$GITHUB_WORKSPACE/.d0030-evidence/installed-helper-sha256.txt"

      - name: Upload bounded D0030 evidence
        uses: actions/upload-artifact@v4
        with:
          name: d0030-posix-evidence
          path: .d0030-evidence/
          if-no-files-found: error
          retention-days: 14
