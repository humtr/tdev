name: D0039 Q5 candidate source gate

on:
  push:
    branches:
      - chatgpt/d0039-r3-q5-iam-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-test-coverage --test test/*.test.mjs
      - run: git diff --check
