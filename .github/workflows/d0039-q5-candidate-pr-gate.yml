name: D0039 Q5 exact integration source gate

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1e0ee228895895643a3835af3b3a6ff197376f80
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-test-coverage --test test/*.test.mjs
      - run: git diff --check
