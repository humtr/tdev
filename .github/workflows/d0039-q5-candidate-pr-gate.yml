name: D0039 R3 evidence descendant gate

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  source-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a70896b52e899bb43c49b9d94d3b0764849ff4e1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove bounded D0039 Revision-3 evidence descendant
        run: |
          set -o pipefail
          node qualification/d0039-r3-source-equivalence.mjs \
            --source 1e0ee228895895643a3835af3b3a6ff197376f80 \
            --evidence a70896b52e899bb43c49b9d94d3b0764849ff4e1 \
            | tee "$RUNNER_TEMP/d0039-r3-source-equivalence.json"
      - name: Upload source-equivalence result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d0039-r3-source-equivalence
          path: ${{ runner.temp }}/d0039-r3-source-equivalence.json
          retention-days: 7
