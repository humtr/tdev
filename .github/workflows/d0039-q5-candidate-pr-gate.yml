name: D0039 Q5 candidate exact-source gate

on:
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b94f938f08b02e606804f007c31edc7ed9706d5f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-test-coverage --test test/*.test.mjs
      - run: git diff --check
