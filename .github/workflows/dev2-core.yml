name: dev2-core
on:
  push:
    branches: [dev-2, 'tmcp/dev2-evidence-*', 'tmcp/dev2-impl-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz -o .bootstrap/node.tar.xz
          echo 'fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  .bootstrap/node.tar.xz' | sha256sum -c -
          tar -xJf .bootstrap/node.tar.xz -C .bootstrap
          echo "$PWD/.bootstrap/node-v24.21.0-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install locked development tools
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Run canonical core contract
        run: node tools/validate.mjs --profile core --output .artifacts/core
      - name: Observe Linux release-fixture capabilities without asserting release PASS
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, shutil, subprocess
          from pathlib import Path
          result = {"scope": "CI capability observation only", "releaseValidation": "not_run", "productionSeal": False}
          for name, args in [("git", ["--version"]), ("podman", ["--version"]), ("systemctl", ["--version"])]:
              exe = shutil.which(name)
              if not exe:
                  result[name] = {"available": False}
                  continue
              try:
                  p = subprocess.run([exe, *args], capture_output=True, text=True, timeout=15)
                  result[name] = {"available": p.returncode == 0, "version": p.stdout.splitlines()[0] if p.returncode == 0 else None}
              except subprocess.TimeoutExpired:
                  result[name] = {"available": False, "reason": "timeout"}
          controllers = Path('/sys/fs/cgroup/cgroup.controllers')
          result["cgroupControllers"] = controllers.read_text().split() if controllers.exists() else []
          if result.get("podman", {}).get("available"):
              try:
                  p = subprocess.run([shutil.which('podman'), 'info', '--format=json'], capture_output=True, text=True, timeout=15)
                  info = json.loads(p.stdout) if p.returncode == 0 else {}
                  host = info.get('host', {})
                  result['rootlessEngine'] = {"available": p.returncode == 0, "security": host.get('security', {}), "cgroupVersion": host.get('cgroupVersion')}
              except (subprocess.TimeoutExpired, ValueError):
                  result['rootlessEngine'] = {"available": False}
          print(json.dumps(result, sort_keys=True))
          PYTHON
      - name: Read exact validation result
        if: always()
        run: test ! -f .artifacts/core/result.json || cat .artifacts/core/result.json
