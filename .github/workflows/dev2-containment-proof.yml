name: dev-2 bounded containment proof
on:
  push:
    branches: ['dev2-containment/**']
permissions:
  contents: read
  id-token: write
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Pinned controller toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dev2-node.tar.xz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz -o "$archive"
          echo "fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dev2-node"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/dev2-node"
          echo "$RUNNER_TEMP/dev2-node/bin" >> "$GITHUB_PATH"
      - name: Install locked controller dependencies without lifecycle scripts
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Operator-only production host pin preflight
        run: |
          node --input-type=module - <<'JS'
          import {readFile,mkdir,realpath} from 'node:fs/promises';
          import {join} from 'node:path';
          import {bytesDigest} from './src/contracts/canonical.mjs';
          import {prepareDependencies} from './src/execution/dependency-artifact.mjs';
          const root=join(await realpath(process.env.RUNNER_TEMP),'dev2-operator-pin-preflight');await mkdir(root,{mode:0o700});
          const dependencies=await prepareDependencies({sourceDirectory:join(await realpath(process.env.GITHUB_WORKSPACE),'node_modules'),cacheDirectory:root,lockDigest:bytesDigest(await readFile('package-lock.json'))});
          console.log(JSON.stringify({kind:'operator-production-pin-preflight',productionAuthority:false,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,sourceCommit:process.env.GITHUB_SHA,engineDigest:bytesDigest(await readFile('/usr/bin/podman')),dependencyArtifactDigest:dependencies.identity}));
          JS
      - name: Real hosted containment falsifiers
        run: node tools/managed-probe.mjs
      - name: Actual required managed profiles and exact response-loss replay
        run: node tools/qualify-managed.mjs
      - name: Preserve bounded qualification evidence in provider logs
        if: always()
        run: |
          if test -f .artifacts/managed-probe/report.json; then cat .artifacts/managed-probe/report.json; fi
