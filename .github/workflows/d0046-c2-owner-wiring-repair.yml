name: D0046 C2 owner wiring repair

on:
  push:
    branches:
      - repair/d0046-c2-owner-wiring-20260909

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/d0046-c2-owner-wiring-20260909
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Normalize exact repair script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qualification/d0046-c2-owner-wiring-repair.mjs')
          source = path.read_text()
          source = source.replace(r"\\`", r"\`").replace(r"\\${", r"\${")
          old = r"""insertAfterOnce(
            worker,
            `    developmentUnitRunner: runner,\n`,
            `    operationCatalog,\n    developmentStart: async (input = {}) => {\n      assertTrialCaseId(input?.caseId);\n      return invokeExecution(input.caseId, 'developmentStart', input);\n    },\n`,
          );""".replace('          ', '')
          new = r"""replaceOnce(
            worker,
            `  const owners = {\n    repository,\n    driveRunner: runner,\n    developmentUnitRunner: runner,\n`,
            `  const owners = {\n    repository,\n    driveRunner: runner,\n    developmentUnitRunner: runner,\n    operationCatalog,\n    developmentStart: async (input = {}) => {\n      assertTrialCaseId(input?.caseId);\n      return invokeExecution(input.caseId, 'developmentStart', input);\n    },\n`,
          );""".replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit(f'expected one broad light-owner repair target, found {source.count(old)}')
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Apply exact-base repair
        id: repair
        shell: bash
        run: |
          set +e
          node qualification/d0046-c2-owner-wiring-repair.mjs > repair.log 2>&1
          status=$?
          cat repair.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d0046-repair-log-${{ github.run_id }}
          path: repair.log
          retention-days: 1

      - name: Stop on repair failure
        if: steps.repair.outputs.status != '0'
        run: exit 1

      - name: Focused regression
        id: focused
        shell: bash
        run: |
          set +e
          node --test test/d0046-c2-owner-wiring.test.mjs test/mcp-trial-runner.test.mjs test/d0046-mcp-trial-deploy.test.mjs test/mcp-surface.test.mjs > focused.log 2>&1
          status=$?
          cat focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d0046-focused-log-${{ github.run_id }}
          path: focused.log
          retention-days: 1

      - name: Stop on focused failure
        if: steps.focused.outputs.status != '0'
        run: exit 1

      - name: Full qualification
        id: full
        shell: bash
        run: |
          set +e
          npm run check > full.log 2>&1
          status=$?
          tail -n 200 full.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d0046-full-log-${{ github.run_id }}
          path: full.log
          retention-days: 1

      - name: Stop on full failure
        if: steps.full.outputs.status != '0'
        run: exit 1

      - name: Diff guard
        run: git diff --check

      - name: Commit validated repair only
        run: |
          rm qualification/d0046-c2-owner-wiring-repair.mjs
          rm .github/workflows/d0046-c2-owner-wiring-repair.yml
          rm -f repair.log focused.log full.log
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore D0046 semantic owner wiring"
          git push origin HEAD:repair/d0046-c2-owner-wiring-20260909
