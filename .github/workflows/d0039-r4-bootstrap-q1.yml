name: D0039 R4 bootstrap and exact-source Q1

on:
  pull_request:
    branches: [development]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  bootstrap-q1:
    if: github.head_ref == 'chatgpt/d0039-r4-source-20260825'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/d0039-r4-source-20260825
          fetch-depth: 0

      - name: Bind candidate inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name humtr
          git config user.email 272709831+humtr@users.noreply.github.com
          git fetch origin chatgpt/d0039-r4-workers-dev-20260825
          test "$(git merge-base d2e4d4d67cbf34b4c6c11fa2e68951ef3c5a0285 HEAD)" = d2e4d4d67cbf34b4c6c11fa2e68951ef3c5a0285

      - name: Synchronize Revision-4 normative owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def add(path, anchor, marker, body):
              p = Path(path); s = p.read_text()
              if marker in s: raise SystemExit(f'{path}: R4 owner text already present')
              if s.count(anchor) != 1: raise SystemExit(f'{path}: owner anchor mismatch')
              p.write_text(s.replace(anchor, '\n' + body.strip() + '\n' + anchor, 1))
          add('docs/SECURITY.md', '\n## 15. Source-layer non-claims\n', '## 14.5 D0039 Revision-4 workers.dev ingress trust boundary', '''
          ## 14.5 D0039 Revision-4 workers.dev ingress trust boundary

          D0039@r4 preserves the Revision-3 trust/controller boundary while replacing only the unavailable Zone-route ingress identity for the isolated non-production qualification substrate. R is one exact `workers.dev` production hostname derived from fresh account-subdomain readback plus the exact Worker service name. It is a provider locator, never a credential, signer, product-current owner, recovery authority or evidence authenticator.

          Before qualification authority is sent to the route owner, provider readback must establish the account workers.dev subdomain, target Worker `enabled=true`, `previews_enabled=false`, and the exact origin `https://<worker>.<account-subdomain>.workers.dev`. Alternate origins, redirects, preview URLs, Zone routes and Custom Domains cannot substitute. The mutation fence uses `tdev.installable-agent-qualification-deployment.v2`; the authenticated qualification RPC remains v2 and identity mismatch still fails before product mutation.

          Revision-4 provider IAM minimum authority is `Workers Scripts Write` on the exact account. Zone-route authority is not required or credited. A distinct IAM observer reads provider-token policy, but Cloudflare token policy does not prove management/release private-key custody or signer absence of provider privilege; terminal Q5 retains those independent separation proofs.
          ''')
          add('docs/DEPLOYMENT.md', '\n## 10. Publication lane\n', '### D0039 Revision-4 workers.dev qualification deployment contract', '''
          ### D0039 Revision-4 workers.dev qualification deployment contract

          Revision 4 preserves `S -> A -> V -> deployment/cutover -> 100-percent writer -> provider readback -> route-owner readback -> exact join`, but R no longer requires a Zone. R binds account/service/deployment epoch, one active Worker version at 100 percent state-changing traffic, fresh account workers.dev subdomain, exact `<worker>.<subdomain>.workers.dev` hostname, `enabled=true`, `previews_enabled=false`, Durable Object namespace/class/jurisdiction, exact route-current Durable Object identity and public verifier bindings.

          Provider admission reads the account and target-Worker subdomain APIs before route-owner qualification. Missing/changed subdomain, disabled workers.dev, enabled previews, origin mismatch, redirect, mixed active versions, ambiguous namespace/class or provider/route-owner identity drift blocks admission. Revision-3 route ID/pattern bindings are absent from deployment identity v2 and cannot authorize Revision-4 mutation.

          Provider/deploy requires effective `Workers Scripts Write` on the exact account; a separate IAM observer uses the appropriate API-token-read namespace. Secret values remain excluded. Every provider mutation still requires the Revision-3 PREPARED run/claim fence and exact target; ambiguous provider effects reconcile by authoritative reread, never by a guessed retry or takeover.
          ''')
          add('docs/QUALIFICATION.md', '\n## 3. Qualification layers\n', '### D0039 Revision-4 workers.dev deployment-realization proof profile', '''
          ### D0039 Revision-4 workers.dev deployment-realization proof profile

          D0039@r4 inherits Revision-3 authenticated evidence, journal/claims, reconciliation, no-live-takeover and Q2-Q10 separation. Exact S reruns the complete source gate. Q1 additionally falsifies deployment-identity-v2 shape, workers.dev hostname/origin derivation, legacy Zone-route fields, disabled workers.dev, enabled previews, provider/route-owner drift and the Revision-4 least-privilege IAM rule.

          Q5 reads account and Worker subdomain state, establishes the exact production hostname/origin, one active V at 100 percent state-changing traffic, Worker/class/namespace/jurisdiction and immutable S/A/config bindings, inventories secret names without values, and only then reads the route owner at that origin. Provider and route-owner deployment-v2 digests must exact-join in one stable epoch. IAM uses a distinct observer and proves account-scoped Workers Scripts Write; signer custody/privilege separation remains independently evidenced.

          Revision 4 uses `qualification/d0039-r4-source-equivalence.mjs` and the bounded `D0039-R4-CURRENT-STATUS` WORKBOARD region. An evidence descendant may add only canonical `docs/evidence/group-f-d0039-r4-*.json` plus that bounded status change. Every other changed path makes a new S. Q2-Q10 remain unverified until executed on the exact admitted R4 deployment.
          ''')
          PY
          git add docs/SECURITY.md docs/DEPLOYMENT.md docs/QUALIFICATION.md
          git diff --cached --check
          git commit -m 'Synchronize D0039 R4 normative owners'

      - name: Integrate Revision-4 source and focused falsifiers
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/chatgpt/d0039-r4-workers-dev-20260825 -- \
            qualification/cloudflare-agent-delivery-runtime.mjs \
            qualification/d0039-r4-source-equivalence.mjs \
            qualification/installable-agent-cloudflare-iam-readback-r4.mjs \
            qualification/installable-agent-cloudflare-readback.mjs \
            qualification/installable-agent-deployment-realization.mjs \
            qualification/installable-agent-qualification-r4.mjs \
            test/d0039-r4-deployment-realization.test.mjs \
            test/d0039-r4-source-equivalence.test.mjs \
            test/installable-agent-cloudflare-iam-readback-r4.test.mjs \
            test/installable-agent-cloudflare-readback.test.mjs \
            test/installable-agent-qualification-r4.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new, label):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{label}: count={s.count(old)}')
              p.write_text(s.replace(old,new,1))

          rep('qualification/installable-agent-qualification-r4.mjs',
              "function expectedWorkersDevHostname(workerScript, accountSubdomain) {\n  boundedString(workerScript, 'workerScript');",
              "function expectedWorkersDevHostname(workerScript, accountSubdomain) {\n  boundedString(workerScript, 'workerScript', 63);\n  if (!/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(workerScript)) {\n    throw new ContractError('invalid_qualification_identity', 'workerScript must be one workers.dev-compatible DNS label');\n  }",
              'identity Worker DNS label')
          rep('qualification/installable-agent-cloudflare-readback.mjs',
              "if (typeof scriptName !== 'string' || scriptName.length === 0 || scriptName.length > 128 || !/^[a-z0-9-]+$/.test(scriptName)) {\n    fail('cloudflare_readback_workers_dev_invalid', 'Worker script name is not a bounded lowercase workers.dev label');\n  }",
              "if (typeof scriptName !== 'string' || !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(scriptName)) {\n    fail('cloudflare_readback_workers_dev_invalid', 'Worker script name is not one workers.dev-compatible DNS label');\n  }",
              'readback Worker DNS label')

          p=Path('test/installable-agent-qualification-r4.test.mjs'); s=p.read_text()
          if s.count("error?.code === 'invalid_record_shape'") != 1: raise SystemExit('R4 strict-shape expectation mismatch')
          s=s.replace("error?.code === 'invalid_record_shape'", "error?.code === 'unexpected_keys'",1)
          s += """\n\ntest('Revision-4 binding rejects workers.dev-incompatible Worker DNS labels', () => {\n  const { runtimeFacts } = fixture();\n  for (const serviceName of ['-bad-worker', 'bad-worker-', 'a'.repeat(64)]) {\n    assert.throws(() => createQualificationDeploymentBindingPlan({\n      sourceSha: runtimeFacts.sourceSha, artifactDigest: runtimeFacts.artifactDigest,\n      artifactManifestDigest: runtimeFacts.artifactManifestDigest, accountId: runtimeFacts.accountId,\n      serviceName, deploymentEpoch: runtimeFacts.deploymentEpoch,\n      qualificationEndpointOrigin: `https://${serviceName}.humtr.workers.dev`,\n      workersDevAccountSubdomain: 'humtr', namespaceId: runtimeFacts.namespaceId,\n    }), (error) => error?.code === 'invalid_qualification_identity');\n  }\n});\n"""
          p.write_text(s)

          p=Path('test/installable-agent-cloudflare-readback.test.mjs'); s=p.read_text()
          s += """\n\ntest('Q5 workers.dev ingress rejects invalid Worker DNS labels', () => {\n  for (const scriptName of ['-bad-worker', 'bad-worker-', 'a'.repeat(64)]) {\n    assert.throws(() => normalizeD0039WorkersDevIngress({\n      scriptName, accountSubdomainResult: { subdomain: 'humtr' },\n      workerSubdomainResult: { enabled: true, previews_enabled: false },\n    }), (error) => error?.code === 'cloudflare_readback_workers_dev_invalid');\n  }\n});\n"""
          p.write_text(s)

          rep('test/cloudflare-agent-delivery-qualification.test.mjs',
              "} from '../qualification/installable-agent-qualification-r3.mjs';",
              "} from '../qualification/installable-agent-qualification-r4.mjs';",
              'DO qualification R4 import')
          rep('test/cloudflare-agent-delivery-qualification.test.mjs',
              "    TDEV_D0039_STATE_CHANGING_TRAFFIC_PERCENTAGE: '100',\n    TDEV_D0039_QUALIFICATION_ENDPOINT_ORIGIN: 'https://qualification.example',\n    TDEV_D0039_ROUTE_ID: 'route-one',\n    TDEV_D0039_ROUTE_PATTERN: 'qualification.example/*',\n    TDEV_D0039_NAMESPACE_ID: 'namespace-one',",
              "    TDEV_D0039_STATE_CHANGING_TRAFFIC_PERCENTAGE: '100',\n    TDEV_D0039_QUALIFICATION_ENDPOINT_ORIGIN: 'https://tdev-d0020-qualification.humtr.workers.dev',\n    TDEV_D0039_INGRESS_KIND: 'workers_dev',\n    TDEV_D0039_WORKERS_DEV_ACCOUNT_SUBDOMAIN: 'humtr',\n    TDEV_D0039_WORKERS_DEV_HOSTNAME: 'tdev-d0020-qualification.humtr.workers.dev',\n    TDEV_D0039_WORKERS_DEV_ENABLED: 'true',\n    TDEV_D0039_WORKERS_DEV_PREVIEWS_ENABLED: 'false',\n    TDEV_D0039_NAMESPACE_ID: 'namespace-one',",
              'DO qualification R4 environment')
          rep('test/cloudflare-agent-delivery-qualification.test.mjs',
              "    qualificationEndpointOrigin: env.TDEV_D0039_QUALIFICATION_ENDPOINT_ORIGIN,\n    routeId: env.TDEV_D0039_ROUTE_ID,\n    routePattern: env.TDEV_D0039_ROUTE_PATTERN,\n    workerScript: env.TDEV_WORKER_SCRIPT,",
              "    qualificationEndpointOrigin: env.TDEV_D0039_QUALIFICATION_ENDPOINT_ORIGIN,\n    ingressKind: env.TDEV_D0039_INGRESS_KIND,\n    workersDevAccountSubdomain: env.TDEV_D0039_WORKERS_DEV_ACCOUNT_SUBDOMAIN,\n    workersDevHostname: env.TDEV_D0039_WORKERS_DEV_HOSTNAME,\n    workersDevEnabled: true,\n    workersDevPreviewsEnabled: false,\n    workerScript: env.TDEV_WORKER_SCRIPT,",
              'DO qualification R4 target')

          rep('test/installable-agent-qualification.test.mjs',
              "} from '../qualification/installable-agent-qualification-r3.mjs';",
              "} from '../qualification/installable-agent-qualification-r4.mjs';",
              'terminal qualification R4 import')
          rep('test/installable-agent-qualification.test.mjs',
              "    qualificationEndpointOrigin: 'https://qualification.example',\n    routeId: 'route-one',\n    routePattern: 'qualification.example/*',\n    workerScript: 'qualification-service',",
              "    qualificationEndpointOrigin: 'https://qualification-service.humtr.workers.dev',\n    ingressKind: 'workers_dev',\n    workersDevAccountSubdomain: 'humtr',\n    workersDevHostname: 'qualification-service.humtr.workers.dev',\n    workersDevEnabled: true,\n    workersDevPreviewsEnabled: false,\n    workerScript: 'qualification-service',",
              'terminal qualification R4 target')

          p=Path('WORKBOARD.md'); s=p.read_text()
          a="- D0039@r3 — `docs/design/0039-d0027-deployment-realization.md` — implement and qualify the accepted Revision-3 D0027 deployment-realization correction"
          b="- D0039@r3 — implement and qualify the accepted Revision-3 D0027 deployment-realization correction"
          if s.count(a)!=1 or s.count(b)!=1: raise SystemExit('WORKBOARD R3 routing mismatch')
          s=s.replace(a,"- D0039@r4 — `docs/design/0039-d0027-deployment-realization.md` — implement and qualify the accepted Revision-4 workers.dev deployment-realization correction",1)
          s=s.replace(b,"- D0039@r4 — implement and qualify the accepted Revision-4 workers.dev deployment-realization correction",1)
          anchor='<!-- D0039-R3-CURRENT-STATUS:END -->'
          if s.count(anchor)!=1: raise SystemExit('WORKBOARD R3 status anchor mismatch')
          block="""\n<!-- D0039-R4-CURRENT-STATUS:BEGIN -->\n- D0039@r4 is accepted from `development@d2e4d4d67cbf34b4c6c11fa2e68951ef3c5a0285` as the same-owner workers.dev ingress correction. Revision-3 source/Q1 and partial Q5 evidence remain immutable history only. This exact source contains the synchronized R4 owners, deployment-identity-v2/provider/IAM implementation and focused falsifiers. Q1 evidence is not yet projected here; Q2-Q10 remain unverified and no R4 provider mutation is claimed.\n<!-- D0039-R4-CURRENT-STATUS:END -->\n"""
          p.write_text(s.replace(anchor,anchor+block,1))
          PY
          rm .github/workflows/d0039-r4-bootstrap-q1.yml
          node --check qualification/installable-agent-qualification-r4.mjs
          node --check qualification/installable-agent-cloudflare-readback.mjs
          node --check qualification/installable-agent-cloudflare-iam-readback-r4.mjs
          node --check qualification/cloudflare-agent-delivery-runtime.mjs
          node --check qualification/d0039-r4-source-equivalence.mjs
          node --check qualification/installable-agent-deployment-realization.mjs
          git add WORKBOARD.md qualification test .github/workflows/d0039-r4-bootstrap-q1.yml
          git diff --cached --check
          git commit -m 'Implement D0039 R4 workers.dev admission'
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "SOURCE_PARENT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"

      - name: Install exact source dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Baseline source gate
        run: npm run check

      - name: Complete exact-source coverage gate
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-test-coverage --test test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/d0039-r4-q1-coverage.txt"

      - name: Diff and worktree integrity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$SOURCE_PARENT" "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "source_sha=$SOURCE_SHA" "source_tree=$SOURCE_TREE" "source_parent=$SOURCE_PARENT" "workflow_run_id=$GITHUB_RUN_ID" "workflow_job=$GITHUB_JOB" > "$RUNNER_TEMP/d0039-r4-q1-source.txt"

      - name: Publish qualified source candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout chatgpt/d0039-r4-source-20260825
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git push origin HEAD:refs/heads/chatgpt/d0039-r4-source-20260825

      - uses: actions/upload-artifact@v4
        with:
          name: d0039-r4-q1-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/d0039-r4-q1-coverage.txt
            ${{ runner.temp }}/d0039-r4-q1-source.txt
          if-no-files-found: error
